# N-way loan_instance lookup: server $unionWith versus application fan-out.
#
# This file is the trimmed sweep (100k, N = 1/2/4/8, one match per key, concurrency 1).
# For the full grid, set:
#   documents: [10000, 50000, 100000]
#   union_count.values: [1, 2, 3, 4, 6, 8]
#   matches_per_key.values: [1, 50]
#   concurrency: [1, 8]
# The recipe only builds the sizes and match counts this sweep actually uses.
name: union-fanout
target:
  database: mi_transformation
  collection: quotes
data:
  mode: existing
  collection: quotes
  scales:
    10000: mi_transformation
    50000: mi_quotes_50000
    100000: mi_quotes_100000
  recipe:
    kind: clone_embed
    source_collection: quotes
    embed:
      from: mi_transformation.loan_instances
      as: loan_instance
      fields: [_id, loan_ruid, terms_of_loan]
    copies: 8
    name_template: "perfenv_union_k{matches_per_key}_entity_{i:02d}"
    matches_per_key: [1, 50]
    seed: 42
sweep:
  documents: [100000]
  union_count:
    values: [1, 2, 4, 8]
    bind: shape
  matches_per_key:
    values: [1]
    bind: data
  concurrency: [1]
  selectivity: [0.5]
  cache_state: [hot]
plans:
  server_union:
    steps:
      - collection: "{{lead}}"
        operation: aggregate
        pipeline:
          - $match:
              loan_instance.loan_ruid: "{{loan_ruid}}"
          - $for:
              each: "collections[1:union_count]"
              as: c
            emit:
              $unionWith:
                coll: "{{c}}"
                pipeline:
                  - $match:
                      loan_instance.loan_ruid: "{{loan_ruid}}"
          - $sort:
              created_at: -1
    combine: concat
  app_fanout:
    steps:
      - $for:
          each: "collections[0:union_count]"
          as: c
          parallel: true
        emit:
          collection: "{{c}}"
          operation: find
          filter:
            loan_instance.loan_ruid: "{{loan_ruid}}"
          sort:
            created_at: -1
    combine:
      mode: merge_sort
      field: created_at
      direction: -1
parameters:
  loan_ruid:
    type: dataset_value
    field: loan_ruid
    strategy: random_existing
goal:
  find_threshold:
    axis: union_count
    where: "p95 > slo"
    for_each: [documents, plan]
slo:
  p95_ms: 100
workload:
  duration_seconds: 8
  warmup_queries: 4
  timeout_ms: 30000
execution:
  repetitions: 1
  max_refinement_rounds: 0
safety:
  non_production: true
