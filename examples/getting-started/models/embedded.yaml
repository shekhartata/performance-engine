# "Embedded" names a MongoDB modeling pattern, not a domain:
# the related entity is nested inside the main document.
model:
  name: embedded
  collections:
    main:
      fields:
        _id: objectId
        group_id: integer
        created_at: datetime
        status: string
        amount: float
        group:
          type: object
          fields:
            group_id: integer
            region: string
        payload: object
