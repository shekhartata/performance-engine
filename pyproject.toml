[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perf-envelope"
version = "0.1.0"
description = "Performance Envelope Engine — empirical MongoDB operating-envelope measurement"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Performance Envelope Engine" }]
dependencies = [
    "pymongo>=4.8",
    "pydantic>=2.8",
    "typer>=0.12",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "scipy>=1.13",
    "rich>=13.7",
    "jinja2>=3.1",
    "matplotlib>=3.9",
    "pyarrow>=16.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[project.scripts]
perfenv = "perf_envelope.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
perf_envelope = ["reports/templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: tests that require a live MongoDB Atlas cluster (MONGODB_URI)",
]

[tool.coverage.run]
source = ["perf_envelope"]
branch = true
omit = ["src/perf_envelope/cli/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
